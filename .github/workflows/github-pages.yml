name: Publish XUNIA Free Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xunia-free-demo
  cancel-in-progress: true

jobs:
  publish-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build keyless static demo
        env:
          # Existing runtime catches Google 3D Tiles failure and drops into
          # OSM/Cesium fallback. No paid Google key is required for this demo.
          GOOGLE_MAPS_API_KEY: xunia-free-fallback
        run: npm run build -- --base=./

      - name: Publish dist to xunia-demo branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xunia-demo
          cp -a dist/. /tmp/xunia-demo/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan xunia-demo
          git rm -rf .
          cp -a /tmp/xunia-demo/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish XUNIA free demo from ${GITHUB_SHA}"
          git push --force origin xunia-demo
