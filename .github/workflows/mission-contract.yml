name: Mission receipt ontology contract
on:
  pull_request:
    paths:
      - 'packages/mission-contract/**'
      - 'src/ontology/**'
      - '.github/workflows/mission-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test packages/mission-contract/contract.test.mjs src/ontology/core.test.mjs src/ontology/dataBridge.test.mjs src/ontology/missionReceipt.test.mjs
