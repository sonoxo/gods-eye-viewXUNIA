name: XUNIA Ontology

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/rvia-xunia-ontology]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: XUNIA ontology focused tests
        run: node --test src/ontology/core.test.mjs

      - name: Full unit suite
        run: npm test

      - name: Production build
        run: npm run build
